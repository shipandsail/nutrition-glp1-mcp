name: docker
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy: { matrix: { include: [ { app: snowbelly, image: snowbelly-nutrition-mcp }, { app: bluedose, image: bluedose-glp1-mcp } ] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USER }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/${{ matrix.image }}:latest,${{ secrets.DOCKERHUB_USER }}/${{ matrix.image }}:1.0.0
